# UI Automation common defaults — uitest-commons
# Priority: uitest.properties < module's properties file < environment variables
#
# Module properties only need to declare values that differ from these defaults.

# Browser engine (chromium | firefox | webkit | safari | chrome | msedge | edge)
browser=chromium

# Run without GUI — override to yes in CI / Docker
headless=no

# Mobile device emulation — empty means desktop (e.g. iPhone 13, Pixel 5)
mobileDevice=

# Ignore TLS certificate errors (yes/no, default yes — MOSIP test environments commonly
# serve internal domains with self-signed certificates). Set to no to enforce real
# certificate verification against a production-like environment.
ignoreHttpsErrors=yes

# Portal login language code
loginlang=eng

# OTP wait timeout in seconds
OTPTimeOut=181

# Snapshot baseline directory (relative to JVM working directory)
snapshotDir=src/test/resources/snapshots

# Extent report name — shown in report header (module + env + date + git appended automatically)
reportName=MOSIP UI Automation

# Version + commit of the application under test (the deployed service/build, not this test suite).
# Shown in the report's System/Environment table as "App Version (under test)" and "App Commit".
# Both are read from one Spring Boot /actuator/info call (appVersionEndpoint appended to
# apiInternalEndPoint): build.version and git.commit.id respectively.
# Explicit overrides win over the fetch; leave a value blank to show "n/a".
appVersion=
appCommit=
appVersionEndpoint=

# S3/MinIO report upload — set to yes to upload after each suite run
push-reports-to-s3=no
s3-host=http://minio.minio:9000
s3-account=automation
s3-region=
reportExpirationInDays=3

# REQUIRED in each module's properties file — namespaces Keycloak users per module
# moduleName=<your-module-name>
